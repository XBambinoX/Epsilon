name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Epsilon.slnx
      - run: dotnet build Epsilon.slnx -c Release --no-restore
      - run: dotnet test Epsilon.slnx -c Release --no-build

      # The package is built on every run, so a broken pack shows up before a release.
      - run: dotnet pack Epsilon.Core/Epsilon.Core.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
